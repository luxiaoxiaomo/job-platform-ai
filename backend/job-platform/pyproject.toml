[tool.poetry]
name = "job-platform"
version = "1.0.0"
description = "AI增强型空岗信息发布对接平台"
authors = ["Your Team <team@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.136.3"
uvicorn = {extras = ["standard"], version = "^0.49.0"}
sqlalchemy = "^2.0.50"
asyncpg = "^0.31.0"
alembic = "^1.18.4"
pydantic = "^2.13.4"
pydantic-settings = "^2.14.1"
redis = "^8.0.0"
celery = "^5.6.3"
langchain = "^1.3.4"
langchain-openai = "^1.2.2"
openai = "^2.41.0"
pgvector = "^0.4.2"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {version = ">=1.7.4", extras = ["bcrypt"]}
python-multipart = "^0.0.32"
httpx = "^0.28.1"
bcrypt = ">=4.0,<5.0"
rapidocr = "^3.8.1"
onnxruntime = "^1.26.0"
pypdfium2 = "^5.9.0"
pillow-heif = "^1.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
black = "^26.5.1"
ruff = "^0.15.16"
isort = "^8.0.1"
mypy = "^2.1.0"
pre-commit = "^4.6.0"
fakeredis = "^2.36.0"
aiosqlite = "^0.22.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

